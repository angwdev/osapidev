# Creates the osapidev OAuth2/OpenID Connect application in Authentik.
# Values come from the environment set in docker-compose.yml (OSAPIDEV_HOST,
# OSAPIDEV_OIDC_CLIENT_ID, OSAPIDEV_OIDC_CLIENT_SECRET). Authentik applies this
# file automatically on start and re-applies it when it changes.
version: 1
metadata:
  name: osapidev - OpenID Connect application
  labels:
    blueprints.goauthentik.io/description: Single sign-on for osapidev
entries:
  # osapidev matches accounts by email and refuses emails marked unverified.
  # Authentik's built-in 'email' scope always sends email_verified=false, so this
  # mapping reports an email as verified only when the user cannot change it
  # themselves (Authentik's default; an admin manages it).
  - model: authentik_providers_oauth2.scopemapping
    id: osapidev-email-scope
    identifiers:
      name: "osapidev: OpenID 'email'"
    attrs:
      scope_name: email
      description: Email address
      expression: |
        from authentik.core.models import USER_ATTRIBUTE_CHANGE_EMAIL

        can_change_email = request.user.group_attributes(request.http_request).get(
            USER_ATTRIBUTE_CHANGE_EMAIL,
            request.http_request.tenant.default_user_change_email,
        )
        return {
            "email": request.user.email,
            "email_verified": not can_change_email,
        }

  - model: authentik_providers_oauth2.oauth2provider
    id: osapidev-provider
    identifiers:
      name: osapidev
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env OSAPIDEV_OIDC_CLIENT_ID
      client_secret: !Env OSAPIDEV_OIDC_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/backend/v1/auth/oidc/callback", !Env OSAPIDEV_HOST]
          redirect_uri_type: authorization
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !KeyOf osapidev-email-scope
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]

  - model: authentik_core.application
    identifiers:
      slug: osapidev
    attrs:
      name: osapidev
      provider: !KeyOf osapidev-provider
      meta_launch_url: !Format ["https://%s", !Env OSAPIDEV_HOST]
