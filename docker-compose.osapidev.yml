# osapidev All-in-One (AIO) deployment using the prebuilt image from GHCR.
#
#   cp .env.example .env              # then edit secrets / URLs
#   docker compose -f docker-compose.osapidev.yml up -d
#
# Database migrations run automatically (osapidev-migrate) before osapidev starts.
# For a production deployment with HTTPS and single sign-on, see deploy/traefik-authentik.

services:
  osapidev:
    image: ghcr.io/angwdev/osapidev:${OSAPIDEV_VERSION:-latest}
    container_name: osapidev
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-testpass}@osapidev-db:5432/osapidev
    depends_on:
      osapidev-migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000" # app
      - "3100:3100" # admin dashboard
      - "3170:3170" # backend API
      - "3200:3200" # webapp bundle server (desktop app)
      - "3080:${HOPP_ALTERNATE_PORT:-80}" # subpath mode

  # Applies database migrations, then exits (runs on every `up`)
  osapidev-migrate:
    image: ghcr.io/angwdev/osapidev:${OSAPIDEV_VERSION:-latest}
    restart: "no"
    working_dir: /dist/backend
    entrypoint: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-testpass}@osapidev-db:5432/osapidev
    depends_on:
      osapidev-db:
        condition: service_healthy

  osapidev-db:
    image: postgres:15
    container_name: osapidev-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpass}
      POSTGRES_DB: osapidev
    volumes:
      - osapidev-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d osapidev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  osapidev-db:
